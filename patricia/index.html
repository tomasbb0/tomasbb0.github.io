<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow, noarchive">
<title>Próximos passos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,500;6..72,600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Layout idea: one narrow column, two short groups of large tap targets, the forwardable paragraph last. */
:root {
  --paper: #f4f6f8;
  --card: #ffffff;
  --ink: #17212b;
  --muted: #5d6b78;
  --line: #d9e0e6;
  --accent: #1d5c63;
  --accent-soft: #e3eff0;
  --done: #8a97a3;
  --display: "Newsreader", Georgia, "Times New Roman", serif;
  --body: "IBM Plex Sans", -apple-system, "Segoe UI", Roboto, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --paper: #12181d; --card: #192229; --ink: #e6edf2; --muted: #9aa8b4;
    --line: #2b3640; --accent: #6fbfc7; --accent-soft: #1c3236; --done: #6c7a86;
    color-scheme: dark;
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--paper); color: var(--ink); font: 16px/1.55 var(--body); }
main { max-width: 600px; margin: 0 auto; padding: 36px 18px 48px; display: grid; gap: 22px; }
h1 { font: 600 2rem/1.15 var(--display); margin: 0; letter-spacing: -0.01em; text-wrap: balance; }
h2 { font: 600 1.2rem/1.3 var(--display); margin: 0; }
p { margin: 0; }
.top { display: grid; gap: 10px; }
.top p { color: var(--muted); }
.progress { display: flex; align-items: center; gap: 12px; font-size: 0.9rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.bar { flex: 1; height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; }
.bar span { display: block; height: 100%; width: 0; background: var(--accent); transition: width .25s ease; }
section { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 18px; display: grid; gap: 10px; }
ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; }
ul > li { position: relative; }
li label { display: grid; grid-template-columns: 24px 1fr; gap: 12px; align-items: start; padding: 11px 36px 11px 8px; border-radius: 8px; cursor: pointer; }
li label:hover { background: var(--accent-soft); }
input[type="checkbox"] { width: 22px; height: 22px; margin: 1px 0 0; accent-color: var(--accent); cursor: pointer; }
input[type="checkbox"]:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.item strong { font-weight: 600; }
.item .why { display: block; font-size: 0.92rem; color: var(--muted); }
li.is-done .item strong, li.is-done .item .give { color: var(--done); text-decoration: line-through; }
.item ul.give { display: block; list-style: disc; margin: 4px 0 0; padding-left: 18px; font-size: 0.92rem; color: var(--muted); }
.item ul.give li { margin: 2px 0; }
.job { display: inline-block; margin: -4px 0 6px 44px; font-size: 0.9rem; color: var(--accent); }
.job:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.ponte { display: block; font-size: 0.92rem; color: var(--muted); margin-top: 2px; }
.ponte .pt { display: block; position: relative; padding-left: 14px; }
.ponte .pt::before { content: '•'; position: absolute; left: 2px; }
li.is-done .item .ponte { color: var(--done); text-decoration: line-through; }
textarea { width: 100%; font: 0.95rem/1.5 var(--body); color: var(--ink); background: var(--accent-soft); border: 1px solid var(--line); border-left: 3px solid var(--accent); border-radius: 8px; padding: 12px 14px; resize: vertical; }
textarea:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.job { display: block; width: fit-content; }
.hint { font-size: 0.92rem; color: var(--muted); }
blockquote { margin: 0; padding: 12px 14px; border-left: 3px solid var(--accent); background: var(--accent-soft); border-radius: 0 8px 8px 0; }
.row { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; }
button { font: 500 0.95rem var(--body); color: #fff; background: var(--accent); border: 0; border-radius: 8px; padding: 9px 16px; cursor: pointer; }
@media (prefers-color-scheme: dark) { button { color: #0f1a1c; } }
button:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
#status, #copied { font-size: 0.88rem; color: var(--muted); }
footer { font-size: 0.88rem; color: var(--muted); }
footer a { color: var(--accent); }
@media (prefers-reduced-motion: reduce) { .bar span { transition: none; } }

.tools { margin: -2px 0 6px 44px; display: flex; gap: 12px; }
.linkbtn { background: none; border: 0; padding: 0; color: var(--accent); font: 500 0.88rem var(--body); cursor: pointer; text-decoration: underline; }
.linkbtn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.del { position: absolute; top: 6px; right: 2px; width: 30px; height: 30px; padding: 0; background: none; color: var(--muted); font-size: 1.15rem; line-height: 1; border-radius: 6px; }
.del:hover { color: var(--ink); background: var(--accent-soft); }
.del:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
li.removed { display: flex; flex-wrap: wrap; align-items: baseline; gap: 8px; padding: 8px; font-size: 0.92rem; color: var(--muted); }
.add { justify-self: start; background: none; color: var(--accent); border: 1px dashed var(--accent); padding: 8px 14px; }
@media (prefers-color-scheme: dark) { .add { color: var(--accent); } }
.editor { display: grid; gap: 8px; margin: 6px 0 10px 44px; }
.editor input, .editor textarea { width: 100%; font: 0.95rem/1.45 var(--body); color: var(--ink); background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; }
.editor input:focus-visible, .editor textarea:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.editor .row button.secondary { background: none; color: var(--ink); border: 1px solid var(--line); }
section > .editor { margin-left: 0; }
</style>
</head>
<body>
<main>
  <div class="top">
    <h1>Próximos passos</h1>
    <div class="progress" aria-live="polite"><div class="bar"><span id="bar"></span></div><span id="count"></span></div>
  </div>

  <section aria-labelledby="h-intros">
    <h2 id="h-intros">Apresentações</h2>
    <ul id="list-intros"></ul>
    <button type="button" class="add" data-section="intros">+ Adicionar ponto</button>
  </section>

  <section aria-labelledby="h-incubeta">
    <h2 id="h-incubeta">Na Incubeta</h2>
    <ul id="list-incubeta"></ul>
    <button type="button" class="add" data-section="incubeta">+ Adicionar ponto</button>
  </section>

  <section aria-labelledby="h-fwd">
    <h2 id="h-fwd">Mensagem para as apresentações</h2>
    <label class="hint" for="blurb">Podes editar antes de copiar.</label>
    <textarea id="blurb" rows="6">Olá! Queria apresentar-te o Tomás Batalha. É expert em implementação de AI e gosta mesmo de pôr as mãos na massa: hoje tem a BytArc, onde implementa agentes de AI e automações em empresas. Conheço o trabalho dele da Google e tenho muita confiança nele. Acho que vale a pena conversarem!</textarea>
    <div class="row"><button type="button" id="copy">Copiar mensagem</button><span id="copied" role="status"></span></div>
  </section>

  <footer><p><span id="status" role="status"></span></p><p>Tomás Batalha · <a href="https://bytarc.com">bytarc.com</a></p></footer>
</main>
<script>
// Items live in a Supabase table (next_steps_checklist). The page may read every row, tick/untick, edit the
// title and "ponte" text, add rows, and hide rows with the × (sets deleted = true; rows are never removed from the
// table, so anything can be restored). It cannot change links. Everything is rendered as text.
var SUPABASE_URL = 'https://pjokdgxjfzigkzfstiky.supabase.co';
var SUPABASE_ANON_KEY = 'sb_publishable_YlbnFHODef_rM2CTgXdgjQ_82xO-u9x'; // publishable key; the table rules above limit what it can do
var FALLBACK = [{"id": "farfetch", "section": "intros", "position": 1, "label": "Diretora de IT da Farfetch", "ponte": "Operações\nAI e automação", "links": [{"url": "https://jobs.lever.co/farfetch/8f9080a7-1c17-40ad-a03a-083495b2bcca", "text": "Vaga: Business Operations Principal, Lisboa"}], "done": false}, {"id": "helena", "section": "intros", "position": 2, "label": "Helena Martins, Sonae (Continente / Worten)", "ponte": "Strategy e CRM\nAI e dados", "links": [{"url": "https://pt.linkedin.com/jobs/view/strategy-consultant-at-mc-4484426712", "text": "Vaga: Strategy Consultant, MC"}, {"url": "https://pt.linkedin.com/jobs/view/crm-behaviour-specialist-at-worten-portugal-4482512415", "text": "Vaga: CRM Behaviour Specialist, Worten"}], "done": false}, {"id": "bloop", "section": "intros", "position": 3, "label": "Francisco, Bloop", "ponte": "Expansão para Espanha\nGo-to-market e operações", "links": [], "done": false}, {"id": "nuno", "section": "intros", "position": 4, "label": "Nuno Pimenta, Growth Ignition", "ponte": "Crescimento + AI e automação", "links": [], "done": false}, {"id": "tiago", "section": "intros", "position": 5, "label": "Tiago Vaz Serra", "ponte": "Startups do portfólio\nGo-to-market, operações ou AI", "links": [], "done": false}, {"id": "miguel", "section": "intros", "position": 6, "label": "Miguel Pina Martins, Science4you", "ponte": "E-commerce e operações\nAI e automação", "links": [], "done": false}, {"id": "bruno", "section": "intros", "position": 7, "label": "Bruno Gouveia", "ponte": "AI e automação", "links": [], "done": false}, {"id": "ref-incubeta-madrid", "section": "incubeta", "position": 1, "label": "Referral: Data & Analytics Consultant, Madrid", "ponte": null, "links": [{"url": "https://incubeta-global.breezy.hr/p/13835c83d3ab01-data-analytics-consultant", "text": "Ver a vaga"}], "done": false}, {"id": "ref-incubeta-aeo", "section": "incubeta", "position": 2, "label": "Referral: Director of AEO/GEO, Londres (contrato de 9 meses)", "ponte": null, "links": [{"url": "https://incubeta-global.breezy.hr/p/bab065e4c71e01-uk-director-of-aeo-geo-ftc", "text": "Ver a vaga"}], "done": false}, {"id": "incubeta-lisboa", "section": "incubeta", "position": 3, "label": "Marketing analytics / PCA / inovação (Lisboa) e AI criativa (Dubai)", "ponte": "O que achas que devo fazer?\nNão vi vagas publicitadas nestas equipas\nAlguma que venha a aparecer?", "links": [], "done": false}];

(function () {
  var API = SUPABASE_URL + '/rest/v1/next_steps_checklist';
  var headers = { 'apikey': SUPABASE_ANON_KEY, 'Authorization': 'Bearer ' + SUPABASE_ANON_KEY, 'Content-Type': 'application/json' };
  var items = [];
  var online = true;
  var statusEl = document.getElementById('status');

  function setStatus(msg) { statusEl.textContent = msg; }
  function el(tag, cls, text) { var n = document.createElement(tag); if (cls) n.className = cls; if (text != null) n.textContent = text; return n; }
  function fmt(ts) { try { return new Date(ts).toLocaleString('pt-PT', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' }); } catch (e) { return ''; } }
  function api(method, query, body, prefer) {
    var h = Object.assign({}, headers); if (prefer) h['Prefer'] = prefer;
    return fetch(API + query, { method: method, headers: h, body: body ? JSON.stringify(body) : undefined })
      .then(function (r) { if (!r.ok) throw new Error(r.status); return r.text().then(function (s) { return s ? JSON.parse(s) : null; }); });
  }

  function renderProgress() {
    var shown = items.filter(function (i) { return !i.deleted; });
    var done = shown.filter(function (i) { return i.done; }).length;
    document.getElementById('count').textContent = done + ' de ' + shown.length;
    document.getElementById('bar').style.width = (shown.length ? 100 * done / shown.length : 0) + '%';
    var latest = shown.filter(function (i) { return i.done; }).map(function (i) { return i.updated_at || ''; }).sort().pop();
    if (online && latest) setStatus('Última atualização: ' + fmt(latest));
  }

  function setDeleted(it, value) {
    setStatus(value ? 'A apagar…' : 'A repor…');
    api('PATCH', '?id=eq.' + encodeURIComponent(it.id), { deleted: value }, 'return=minimal')
      .then(function () { it.deleted = value; render(); setStatus(value ? 'Apagado.' : 'Reposto.'); })
      .catch(function () { setStatus('Não ficou guardado. Tenta outra vez.'); });
  }

  function removedNode(it) {
    var li = el('li', 'removed'); li.appendChild(el('span', null, 'Apagado: ' + it.label));
    var undo = el('button', 'linkbtn', 'Desfazer'); undo.type = 'button';
    undo.addEventListener('click', function () { setDeleted(it, false); });
    li.appendChild(undo);
    return li;
  }

  function itemNode(it) {
    if (it.deleted) return removedNode(it);
    var li = el('li'); li.dataset.id = it.id;
    var label = el('label'); label.htmlFor = 'c-' + it.id;
    var box = el('input'); box.type = 'checkbox'; box.id = 'c-' + it.id; box.checked = !!it.done; box.disabled = !online;
    var span = el('span', 'item');
    span.appendChild(el('strong', null, it.label));
    var lines = (it.ponte || '').split('\n').map(function (s) { return s.trim(); }).filter(Boolean);
    if (lines.length) { var pt = el('span', 'ponte'); lines.forEach(function (l) { pt.appendChild(el('span', 'pt', l)); }); span.appendChild(pt); }
    label.appendChild(box); label.appendChild(span); li.appendChild(label);
    (it.links || []).forEach(function (l) {
      if (!l || typeof l.url !== 'string' || l.url.indexOf('https://') !== 0) return;
      var a = el('a', 'job', (l.text || 'Ver') + ' ↗'); a.href = l.url; a.target = '_blank'; a.rel = 'noopener'; li.appendChild(a);
    });
    if (online) {
      var tools = el('div', 'tools'); var edit = el('button', 'linkbtn', 'Editar'); edit.type = 'button';
      edit.addEventListener('click', function () { openEditor(li, it); });
      tools.appendChild(edit); li.appendChild(tools);
      var del = el('button', 'del', '×'); del.type = 'button'; del.title = 'Apagar'; del.setAttribute('aria-label', 'Apagar: ' + it.label);
      del.addEventListener('click', function () { setDeleted(it, true); });
      li.appendChild(del);
    }
    li.classList.toggle('is-done', !!it.done);
    box.addEventListener('change', function () {
      it.done = box.checked; it.updated_at = new Date().toISOString(); li.classList.toggle('is-done', it.done); renderProgress();
      setStatus('A guardar…');
      api('PATCH', '?id=eq.' + encodeURIComponent(it.id), { done: it.done, updated_at: it.updated_at }, 'return=minimal')
        .then(function () { setStatus('Guardado.'); })
        .catch(function () { it.done = !it.done; box.checked = it.done; li.classList.toggle('is-done', it.done); renderProgress(); setStatus('Não ficou guardado. Verifica a ligação e tenta outra vez.'); });
    });
    return li;
  }

  function editorNode(titleVal, ponteVal, saveText, onSave, onCancel) {
    var f = el('form', 'editor');
    var t = el('input'); t.type = 'text'; t.value = titleVal; t.placeholder = 'Nome ou título'; t.maxLength = 200; t.setAttribute('aria-label', 'Título');
    var p = el('textarea'); p.rows = 3; p.value = ponteVal; p.placeholder = 'Um ponto por linha'; p.maxLength = 600; p.setAttribute('aria-label', 'Pontos, um por linha');
    var row = el('div', 'row'); var save = el('button', null, saveText); save.type = 'submit';
    var cancel = el('button', 'secondary', 'Cancelar'); cancel.type = 'button'; cancel.addEventListener('click', onCancel);
    row.appendChild(save); row.appendChild(cancel); f.appendChild(t); f.appendChild(p); f.appendChild(row);
    f.addEventListener('submit', function (ev) {
      ev.preventDefault(); var title = t.value.trim(); if (!title) { t.focus(); return; }
      save.disabled = true; onSave(title, p.value.trim()).catch(function () { save.disabled = false; setStatus('Não ficou guardado. Tenta outra vez.'); });
    });
    setTimeout(function () { t.focus(); }, 0);
    return f;
  }

  function openEditor(li, it) {
    var form = editorNode(it.label, it.ponte || '', 'Guardar', function (title, ponte) {
      setStatus('A guardar…');
      return api('PATCH', '?id=eq.' + encodeURIComponent(it.id), { label: title, ponte: ponte || null }, 'return=minimal')
        .then(function () { it.label = title; it.ponte = ponte; render(); setStatus('Guardado.'); });
    }, function () { render(); });
    li.replaceChildren(form);
  }

  function openAdd(btn) {
    var section = btn.dataset.section; btn.hidden = true;
    var form = editorNode('', '', 'Adicionar', function (title, ponte) {
      var pos = items.filter(function (i) { return i.section === section; }).reduce(function (m, i) { return Math.max(m, i.position || 0); }, 0) + 1;
      var row = { id: 'p-' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6), label: title, ponte: ponte || null, section: section, position: pos, done: false, updated_at: new Date().toISOString() };
      setStatus('A guardar…');
      return api('POST', '', row, 'return=minimal').then(function () { row.links = []; items.push(row); form.remove(); btn.hidden = false; render(); setStatus('Adicionado.'); });
    }, function () { form.remove(); btn.hidden = false; });
    btn.parentNode.insertBefore(form, btn);
  }

  function render() {
    ['intros', 'incubeta'].forEach(function (s) {
      var ul = document.getElementById('list-' + s);
      ul.replaceChildren.apply(ul, items.filter(function (i) { return i.section === s; })
        .sort(function (a, b) { return (a.position || 0) - (b.position || 0); }).map(itemNode));
    });
    document.querySelectorAll('.add').forEach(function (b) { b.hidden = !online; });
    renderProgress();
  }

  document.querySelectorAll('.add').forEach(function (b) { b.addEventListener('click', function () { openAdd(b); }); });
  api('GET', '?select=id,label,ponte,links,section,position,done,updated_at&deleted=is.false', null)
    .then(function (rows) { items = rows || []; render(); })
    .catch(function () { online = false; items = FALLBACK; render(); setStatus('Não consegui ligar à base de dados: a lista está só para leitura. Tenta recarregar a página.'); });

  document.getElementById('copy').addEventListener('click', function () {
    var text = document.getElementById('blurb').value.trim();
    var out = document.getElementById('copied');
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(function () { out.textContent = 'Copiado.'; }, function () { out.textContent = 'Seleciona o texto acima para copiar.'; });
    } else { out.textContent = 'Seleciona o texto acima para copiar.'; }
  });
})();
</script>
</body>
</html>
