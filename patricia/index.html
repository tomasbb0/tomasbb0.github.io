<!DOCTYPE html>
<html lang="pt-PT">
<head>

<link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,500;6..72,600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Layout idea: one narrow column, two short groups of large tap targets, the forwardable paragraph last. */
:root {
  --paper: #f4f6f8;
  --card: #ffffff;
  --ink: #17212b;
  --muted: #5d6b78;
  --line: #d9e0e6;
  --accent: #1d5c63;
  --accent-soft: #e3eff0;
  --done: #8a97a3;
  --display: "Newsreader", Georgia, "Times New Roman", serif;
  --body: "IBM Plex Sans", -apple-system, "Segoe UI", Roboto, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --paper: #12181d; --card: #192229; --ink: #e6edf2; --muted: #9aa8b4;
    --line: #2b3640; --accent: #6fbfc7; --accent-soft: #1c3236; --done: #6c7a86;
    color-scheme: dark;
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--paper); color: var(--ink); font: 16px/1.55 var(--body); }
main { max-width: 600px; margin: 0 auto; padding: 36px 18px 48px; display: grid; gap: 22px; }
h1 { font: 600 2rem/1.15 var(--display); margin: 0; letter-spacing: -0.01em; text-wrap: balance; }
h2 { font: 600 1.2rem/1.3 var(--display); margin: 0; }
p { margin: 0; }
.top { display: grid; gap: 10px; }
.top p { color: var(--muted); }
.progress { display: flex; align-items: center; gap: 12px; font-size: 0.9rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.bar { flex: 1; height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; }
.bar span { display: block; height: 100%; width: 0; background: var(--accent); transition: width .25s ease; }
section { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 18px; display: grid; gap: 10px; }
ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; }
li label { display: grid; grid-template-columns: 24px 1fr; gap: 12px; align-items: start; padding: 11px 8px; border-radius: 8px; cursor: pointer; }
li label:hover { background: var(--accent-soft); }
input[type="checkbox"] { width: 22px; height: 22px; margin: 1px 0 0; accent-color: var(--accent); cursor: pointer; }
input[type="checkbox"]:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.item strong { font-weight: 600; }
.item .why { display: block; font-size: 0.92rem; color: var(--muted); }
li.is-done .item strong, li.is-done .item .give { color: var(--done); text-decoration: line-through; }
.item ul.give { display: block; list-style: disc; margin: 4px 0 0; padding-left: 18px; font-size: 0.92rem; color: var(--muted); }
.item ul.give li { margin: 2px 0; }
.job { display: inline-block; margin: -4px 0 6px 44px; font-size: 0.9rem; color: var(--accent); }
.job:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.ponte { display: block; font-size: 0.92rem; color: var(--muted); margin-top: 2px; }
.ponte b { color: var(--ink); font-weight: 600; }
li.is-done .item .ponte { color: var(--done); text-decoration: line-through; }
textarea { width: 100%; font: 0.95rem/1.5 var(--body); color: var(--ink); background: var(--accent-soft); border: 1px solid var(--line); border-left: 3px solid var(--accent); border-radius: 8px; padding: 12px 14px; resize: vertical; }
textarea:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.job { display: block; width: fit-content; }
.hint { font-size: 0.92rem; color: var(--muted); }
blockquote { margin: 0; padding: 12px 14px; border-left: 3px solid var(--accent); background: var(--accent-soft); border-radius: 0 8px 8px 0; }
.row { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; }
button { font: 500 0.95rem var(--body); color: #fff; background: var(--accent); border: 0; border-radius: 8px; padding: 9px 16px; cursor: pointer; }
@media (prefers-color-scheme: dark) { button { color: #0f1a1c; } }
button:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
#status, #copied { font-size: 0.88rem; color: var(--muted); }
footer { font-size: 0.88rem; color: var(--muted); }
footer a { color: var(--accent); }
@media (prefers-reduced-motion: reduce) { .bar span { transition: none; } }
</style>
</head>
<body>
<main>
  <div class="top">
    <h1>Próximos passos</h1>
    <div class="progress" aria-live="polite"><div class="bar"><span id="bar"></span></div><span id="count">0 de 11</span></div>
  </div>

  <section aria-labelledby="h-intros">
    <h2 id="h-intros">Apresentações</h2>
    <ul>
      <li><label for="farfetch"><input type="checkbox" id="farfetch"><span class="item"><strong>Diretora de IT da Farfetch</strong><span class="ponte"><b>Ponte:</b> apresentar-me para a vaga de Business Operations Principal (Catalogue &amp; Selection) em Lisboa e pedir uma conversa curta sobre a equipa.</span></span></label><a class="job" href="https://jobs.lever.co/farfetch/8f9080a7-1c17-40ad-a03a-083495b2bcca" target="_blank" rel="noopener">Vaga: Business Operations Principal, Lisboa ↗</a></li>
      <li><label for="helena"><input type="checkbox" id="helena"><span class="item"><strong>Helena Martins, Sonae (Continente / Worten)</strong><span class="ponte"><b>Ponte:</b> apresentar-me para a vaga de Strategy Consultant na MC (Health &amp; Beauty, Lisboa). Alternativa: CRM Behaviour Specialist na Worten.</span></span></label><a class="job" href="https://pt.linkedin.com/jobs/view/strategy-consultant-at-mc-4484426712" target="_blank" rel="noopener">Vaga: Strategy Consultant, MC ↗</a><a class="job" href="https://pt.linkedin.com/jobs/view/crm-behaviour-specialist-at-worten-portugal-4482512415" target="_blank" rel="noopener">Vaga: CRM Behaviour Specialist, Worten ↗</a></li>
      <li><label for="bloop"><input type="checkbox" id="bloop"><span class="item"><strong>Francisco, Bloop</strong><span class="ponte"><b>Ponte:</b> pedir uma conversa sobre uma função em go-to-market ou operações na expansão para Espanha.</span></span></label></li>
      <li><label for="nuno"><input type="checkbox" id="nuno"><span class="item"><strong>Nuno Pimenta, Growth Ignition</strong><span class="ponte"><b>Ponte:</b> pedir um café para explorar uma parceria: ele trabalha o crescimento dos clientes, eu implemento a AI e a automação.</span></span></label></li>
      <li><label for="tiago"><input type="checkbox" id="tiago"><span class="item"><strong>Tiago Vaz Serra</strong><span class="ponte"><b>Ponte:</b> pedir que me apresente a startups em que investiu que precisem de alguém em go-to-market, operações ou AI.</span></span></label></li>
      <li><label for="miguel"><input type="checkbox" id="miguel"><span class="item"><strong>Miguel Pina Martins, Science4you</strong><span class="ponte"><b>Ponte:</b> pedir uma conversa sobre onde a AI pode ajudar o e-commerce e as operações, num projeto pela BytArc ou numa função.</span></span></label></li>
      <li><label for="bruno"><input type="checkbox" id="bruno"><span class="item"><strong>Bruno Gouveia</strong><span class="ponte"><b>Ponte:</b> pedir uma conversa de 20 minutos sobre oportunidades em AI e automação na empresa dele.</span></span></label></li>
    </ul>
  </section>

  <section aria-labelledby="h-incubeta">
    <h2 id="h-incubeta">Na Incubeta</h2>
    <ul>
      <li><label for="ref-incubeta-madrid"><input type="checkbox" id="ref-incubeta-madrid"><span class="item"><strong>Referral: Data &amp; Analytics Consultant, Madrid</strong><span class="ponte"><b>Ponte:</b> referral interno para a vaga.</span></span></label><a class="job" href="https://incubeta-global.breezy.hr/p/13835c83d3ab01-data-analytics-consultant" target="_blank" rel="noopener">Ver a vaga ↗</a></li>
      <li><label for="ref-incubeta-aeo"><input type="checkbox" id="ref-incubeta-aeo"><span class="item"><strong>Referral: Director of AEO/GEO, Londres (contrato de 9 meses)</strong><span class="ponte"><b>Ponte:</b> referral interno para a vaga.</span></span></label><a class="job" href="https://incubeta-global.breezy.hr/p/bab065e4c71e01-uk-director-of-aeo-geo-ftc" target="_blank" rel="noopener">Ver a vaga ↗</a></li>
      <li><label for="incubeta-lisboa"><input type="checkbox" id="incubeta-lisboa"><span class="item"><strong>Equipa de marketing analytics / PCA / inovação, em Lisboa</strong><span class="ponte"><b>Ponte:</b> ver se há espaço na equipa, em full-time, part-time ou por projeto.</span></span></label></li>
      <li><label for="incubeta-dubai"><input type="checkbox" id="incubeta-dubai"><span class="item"><strong>Dubai: criatividade + AI, projetos frontier</strong><span class="ponte"><b>Ponte:</b> uma conversa com quem lidera os projetos de AI criativa.</span></span></label></li>

  <section aria-labelledby="h-fwd">
    <h2 id="h-fwd">Mensagem para as apresentações</h2>
    <label class="hint" for="blurb">Podes editar antes de copiar.</label>
    <textarea id="blurb" rows="6">Olá! Queria apresentar-te o Tomás Batalha. É expert em implementação de AI e gosta mesmo de pôr as mãos na massa: hoje tem a BytArc, onde implementa agentes de AI e automações em empresas. Conheço o trabalho dele da Google e tenho muita confiança nele. Acho que vale a pena conversarem!</textarea>
    <div class="row"><button type="button" id="copy">Copiar mensagem</button><span id="copied" role="status"></span></div>
  </section>

  <footer><p><span id="status"></span></p><p>Tomás Batalha · <a href="https://bytarc.com">bytarc.com</a></p></footer>
</main>
<script>
// Shared state lives in a Supabase table (next_steps_checklist: id text, done bool, updated_at timestamptz).
// Leave SUPABASE_URL empty to run in preview mode, where ticks stay in this browser only.
var SUPABASE_URL = 'https://pjokdgxjfzigkzfstiky.supabase.co';
var SUPABASE_ANON_KEY = 'sb_publishable_YlbnFHODef_rM2CTgXdgjQ_82xO-u9x'; // publishable key: the table's rules only allow reading and ticking these 9 rows

(function () {
  var boxes = Array.prototype.slice.call(document.querySelectorAll('input[type="checkbox"]'));
  var statusEl = document.getElementById('status');
  var shared = !!(SUPABASE_URL && SUPABASE_ANON_KEY);
  var LOCAL_KEY = 'patricia-checklist';
  var headers = { 'apikey': SUPABASE_ANON_KEY, 'Authorization': 'Bearer ' + SUPABASE_ANON_KEY, 'Content-Type': 'application/json' };

  function render() {
    var done = boxes.filter(function (b) { return b.checked; }).length;
    boxes.forEach(function (b) { b.closest('li').classList.toggle('is-done', b.checked); });
    document.getElementById('count').textContent = done + ' de ' + boxes.length;
    document.getElementById('bar').style.width = (100 * done / boxes.length) + '%';
  }
  function fmt(ts) {
    try { return new Date(ts).toLocaleString('pt-PT', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' }); } catch (e) { return ''; }
  }
  function load() {
    if (!shared) {
      var saved = {};
      try { saved = JSON.parse(localStorage.getItem(LOCAL_KEY) || '{}'); } catch (e) {}
      boxes.forEach(function (b) { b.checked = !!saved[b.id]; });
      statusEl.textContent = 'Pré-visualização: as marcações ficam só neste browser.';
      render();
      return;
    }
    fetch(SUPABASE_URL + '/rest/v1/next_steps_checklist?select=id,done,updated_at', { headers: headers })
      .then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); })
      .then(function (rows) {
        var latest = '';
        rows.forEach(function (row) {
          var b = document.getElementById(row.id);
          if (b) b.checked = !!row.done;
          if (row.done && row.updated_at > latest) latest = row.updated_at;
        });
        statusEl.textContent = latest ? 'Última atualização: ' + fmt(latest) : '';
        render();
      })
      .catch(function () { statusEl.textContent = 'Não consegui carregar o estado. Tenta recarregar a página.'; render(); });
  }
  function save(b) {
    if (!shared) {
      var saved = {};
      boxes.forEach(function (x) { saved[x.id] = x.checked; });
      try { localStorage.setItem(LOCAL_KEY, JSON.stringify(saved)); } catch (e) {}
      return;
    }
    statusEl.textContent = 'A guardar…';
    fetch(SUPABASE_URL + '/rest/v1/next_steps_checklist?id=eq.' + encodeURIComponent(b.id), {
      method: 'PATCH', headers: Object.assign({ 'Prefer': 'return=minimal' }, headers),
      body: JSON.stringify({ done: b.checked, updated_at: new Date().toISOString() })
    }).then(function (r) {
      if (!r.ok) throw new Error(r.status);
      statusEl.textContent = 'Guardado.';
    }).catch(function () {
      b.checked = !b.checked; render();
      statusEl.textContent = 'Não ficou guardado. Verifica a ligação e tenta outra vez.';
    });
  }
  boxes.forEach(function (b) { b.addEventListener('change', function () { render(); save(b); }); });
  load();

  document.getElementById('copy').addEventListener('click', function () {
    var text = document.getElementById('blurb').value.trim();
    var out = document.getElementById('copied');
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(function () { out.textContent = 'Copiado.'; },
        function () { out.textContent = 'Seleciona o texto acima para copiar.'; });
    } else { out.textContent = 'Seleciona o texto acima para copiar.'; }
  });
})();
</script>

</html>
