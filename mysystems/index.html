<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Systems map · Tomás Batalha · BytArc</title>
<meta name="description" content="An interactive map of every system Tomás Batalha has built at BytArc: agents, the JobAlfred platform, AI products, data models, client systems and tools.">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#030305">
<link rel="apple-touch-icon" href="/assets/apple-touch-icon.png?v=5">
<link rel="icon" href="/favicon.ico?v=5" sizes="48x48">
<link rel="icon" href="/favicon.svg?v=6" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap">
<style>
@property --accent{syntax:"<color>";inherits:true;initial-value:#9AA0FF}
:root{--bg:#030305;--text:#F2F2F7;--t2:#A9A9B6;--t3:#71717F;--line:rgba(255,255,255,.09);
 --disp:"Space Grotesk",ui-sans-serif,system-ui,sans-serif;--mono:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,monospace;color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{--accent:#9AA0FF;transition:--accent .9s;margin:0;background:var(--bg);color:var(--text);font:14px/1.55 var(--mono);-webkit-font-smoothing:antialiased;overflow:hidden;display:flex;flex-direction:column;height:100dvh}
button{font:inherit;color:inherit}
a{color:inherit}
#bg{position:fixed;inset:0;z-index:0;pointer-events:none}
.floor{position:fixed;left:-60%;right:-60%;bottom:-6%;height:48vh;z-index:0;pointer-events:none;
 background-image:linear-gradient(color-mix(in srgb,var(--accent) 22%,transparent) 1px,transparent 1px),linear-gradient(90deg,color-mix(in srgb,var(--accent) 22%,transparent) 1px,transparent 1px);
 background-size:64px 64px;transform:perspective(420px) rotateX(64deg);transform-origin:50% 100%;
 -webkit-mask-image:linear-gradient(to top,#000 0%,transparent 80%);mask-image:linear-gradient(to top,#000 0%,transparent 80%);opacity:.55;animation:floor 5s linear infinite}
@keyframes floor{to{background-position:0 64px}}
.glow{position:fixed;inset:0;z-index:0;pointer-events:none;background:radial-gradient(55% 45% at 50% 52%,color-mix(in srgb,var(--accent) 11%,transparent),transparent 70%)}

/* top bar */
.bar{position:relative;z-index:5;display:flex;align-items:center;gap:18px;padding:14px 28px}
.brand{display:inline-flex;align-items:center;gap:10px;font:600 17px/1 var(--disp);letter-spacing:-.02em;text-decoration:none}
.brand img{width:28px;height:18px;display:block}
.crumb{display:flex;align-items:center;gap:8px;font-size:12px;text-transform:uppercase;letter-spacing:.1em;color:var(--t3);min-width:0}
.crumb button{background:none;border:0;padding:0;cursor:pointer;color:var(--t2);text-transform:inherit;letter-spacing:inherit}
.crumb button:hover{color:var(--text)}
.crumb b{color:var(--accent);font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar nav{margin-left:auto;display:flex;gap:18px;font-size:12.5px;color:var(--t2)}
.bar nav a{text-decoration:none}.bar nav a:hover,.bar nav a[aria-current]{color:var(--text)}

main{position:relative;flex:1;min-height:0;z-index:2}
.view{position:absolute;inset:0;display:flex;flex-direction:column;transition:opacity .55s ease,transform .75s cubic-bezier(.2,.75,.1,1)}
.view[hidden]{display:none}
#map.leave{opacity:0;transform:scale(2.3);pointer-events:none}
#map.enter{opacity:0;transform:scale(1.5)}
#area.leave{opacity:0;transform:scale(.85);pointer-events:none}
#area.enter{opacity:0;transform:scale(.9)}

/* map */
.intro{text-align:center;padding:4px 20px 0}
.kick{font-size:11px;letter-spacing:.24em;text-transform:uppercase;color:var(--t3);margin:0}
.kick i{font-style:normal;color:var(--accent)}
h1{font:600 clamp(28px,4.4vw,50px)/1.05 var(--disp);letter-spacing:-.035em;margin:8px 0 8px}
.sub{font-size:12.5px;color:var(--t2);margin:0}
.sub b{color:var(--text);font-weight:500}
#stage{position:relative;flex:1;min-height:300px;perspective:1300px}
#plane{position:absolute;inset:0;transform-style:preserve-3d}
#wires{position:absolute;inset:0;width:100%;height:100%;overflow:visible;pointer-events:none}
#wires .wire{fill:none;stroke-width:1.3;stroke-dasharray:3 7;opacity:.6;animation:dash 1.4s linear infinite}
#wires .hex{fill:none;stroke:rgba(255,255,255,.07);stroke-width:1;stroke-dasharray:1 5}
@keyframes dash{to{stroke-dashoffset:-20}}
.node,#core{position:absolute;width:0;height:0;padding:0;border:0;background:none;cursor:pointer;-webkit-tap-highlight-color:transparent}
.node{--d:124px}
.float{position:absolute;left:0;top:0;animation:bob 7s ease-in-out infinite;animation-delay:var(--dl,0s)}
@keyframes bob{50%{transform:translateY(-7px)}}
.orb{position:absolute;left:calc(var(--d)/-2);top:calc(var(--d)/-2);width:var(--d);height:var(--d);border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;
 background:radial-gradient(circle at 50% 30%,color-mix(in srgb,var(--c) 26%,#0c0c12),#060609 72%);border:1px solid color-mix(in srgb,var(--c) 50%,transparent);
 box-shadow:0 0 0 7px color-mix(in srgb,var(--c) 6%,transparent),0 0 44px color-mix(in srgb,var(--c) 26%,transparent);transition:transform .35s cubic-bezier(.2,.8,.2,1),box-shadow .35s}
.orb b{font:700 calc(var(--d)*.3)/1 var(--disp);letter-spacing:-.04em}
.orb small{font-size:9.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--t2);margin-top:4px}
.orbit{position:absolute;inset:-15px;border-radius:50%;border:1px dashed color-mix(in srgb,var(--c) 28%,transparent);animation:spin 26s linear infinite;pointer-events:none}
.orbit i{position:absolute;left:50%;top:50%;width:6px;height:6px;margin:-3px;border-radius:50%;background:var(--c);opacity:.35;transform:rotate(var(--a)) translateY(calc(var(--d)/-2 - 15px))}
.orbit i.on{opacity:1;box-shadow:0 0 9px var(--c)}
@keyframes spin{to{transform:rotate(360deg)}}
.lbl{position:absolute;left:0;top:calc(var(--d)/2 + 24px);transform:translateX(-50%);width:210px;text-align:center;pointer-events:none}
.lbl strong{display:block;font:600 16px/1.2 var(--disp);letter-spacing:-.01em;color:var(--text)}
.lbl em{display:block;font-style:normal;font-size:11px;color:var(--t3);margin-top:3px}
.node:hover .orb,.node:focus-visible .orb{transform:scale(1.1);box-shadow:0 0 0 9px color-mix(in srgb,var(--c) 12%,transparent),0 0 80px color-mix(in srgb,var(--c) 45%,transparent)}
.node:focus-visible,#core:focus-visible{outline:none}
.node:focus-visible .orb,#core:focus-visible .orb{outline:2px solid var(--c);outline-offset:20px}
#core{left:50%;top:50%;--d:150px;--c:#E8E8F0}
#core .orb{background:radial-gradient(circle at 50% 30%,#23232c,#07070a 72%)}
#core .orb b{font-size:calc(var(--d)*.32)}
.halo{position:absolute;border-radius:50%;pointer-events:none;border:1px solid rgba(255,255,255,.1)}
.h1{left:calc(var(--d)/-2 - 22px);top:calc(var(--d)/-2 - 22px);width:calc(var(--d) + 44px);height:calc(var(--d) + 44px);border-style:dashed;animation:spin 40s linear infinite}
.h2{left:calc(var(--d)/-2 - 44px);top:calc(var(--d)/-2 - 44px);width:calc(var(--d) + 88px);height:calc(var(--d) + 88px);border-color:rgba(255,255,255,.05);border-top-color:color-mix(in srgb,var(--accent) 70%,transparent);animation:spin 9s linear infinite reverse}
#core .lbl{top:calc(var(--d)/2 + 56px)}
#core .lbl strong{white-space:nowrap;font-size:13px;font-family:var(--mono);font-weight:500;color:var(--t2)}
#core:hover .lbl strong{color:var(--text)}
#core:hover .orb{transform:scale(1.06)}
.mapfoot{text-align:center;font-size:11px;color:var(--t3);padding:6px 20px 14px;margin:0}
.mapfoot i{display:inline-block;width:6px;height:6px;border-radius:50%;background:#E8E8F0;box-shadow:0 0 8px #fff;margin:0 4px 1px 0;vertical-align:middle}

/* area */
.ahead{display:flex;align-items:flex-end;gap:18px 28px;padding:2px 28px 0;flex-wrap:wrap}
.back{flex:none;background:rgba(255,255,255,.03);border:1px solid var(--line);border-radius:999px;padding:8px 14px;font-size:11px;letter-spacing:.12em;text-transform:uppercase;cursor:pointer;color:var(--t2)}
.back:hover{color:var(--text);border-color:rgba(255,255,255,.2)}
.atitle{min-width:0}
.ameta{font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);margin:0}
.atitle h2{font:600 clamp(26px,3.8vw,44px)/1.05 var(--disp);letter-spacing:-.035em;margin:6px 0 2px}
.asub{font-size:12.5px;color:var(--t2);margin:0}
.tabs{display:flex;gap:8px;overflow-x:auto;padding:14px 28px 2px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:none;display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:rgba(255,255,255,.02);border-radius:999px;padding:7px 12px;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--t2);cursor:pointer;transition:.25s}
.tabs button i{width:7px;height:7px;border-radius:50%;background:var(--c);box-shadow:0 0 8px var(--c)}
.tabs button:hover{color:var(--text)}
.tabs button[aria-pressed=true]{border-color:color-mix(in srgb,var(--c) 70%,transparent);color:var(--text);background:color-mix(in srgb,var(--c) 13%,transparent)}
.scene{position:relative;flex:1;min-height:320px;perspective:1150px;touch-action:none;cursor:grab;overflow:hidden;user-select:none;-webkit-user-select:none}
.scene.drag{cursor:grabbing}
#ring{position:absolute;left:50%;top:48%;width:0;height:0;transform-style:preserve-3d}
.shadow{position:absolute;left:50%;top:calc(48% + var(--ch)/2 + 18px);width:min(760px,95%);height:70px;transform:translateX(-50%);background:radial-gradient(closest-side,color-mix(in srgb,var(--accent) 30%,transparent),transparent);filter:blur(8px);pointer-events:none}
.card{position:absolute;left:0;top:0;width:var(--cw);height:var(--ch);margin:calc(var(--ch)/-2) 0 0 calc(var(--cw)/-2);padding:18px 18px 16px;border-radius:20px;overflow:hidden;
 display:flex;flex-direction:column;cursor:pointer;backface-visibility:hidden;-webkit-backface-visibility:hidden;
 background:linear-gradient(165deg,color-mix(in srgb,var(--c) 17%,#0e0e14) 0%,#09090d 58%);border:1px solid color-mix(in srgb,var(--c) 28%,transparent);
 box-shadow:0 30px 60px rgba(0,0,0,.55),inset 0 1px 0 rgba(255,255,255,.06);transition:border-color .4s,box-shadow .4s}
.card.front{border-color:color-mix(in srgb,var(--c) 80%,transparent);box-shadow:0 0 0 1px color-mix(in srgb,var(--c) 35%,transparent),0 0 80px color-mix(in srgb,var(--c) 32%,transparent),0 30px 60px rgba(0,0,0,.6)}
.card::after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(110deg,transparent 35%,rgba(255,255,255,.08) 50%,transparent 65%);background-size:260% 100%;background-position:120% 0;opacity:0}
.card.front::after{opacity:1;animation:sweep 3.6s ease-in-out infinite}
@keyframes sweep{0%{background-position:120% 0}60%,100%{background-position:-60% 0}}
.ctop{display:flex;justify-content:space-between;align-items:center;gap:8px}
.rk{font:500 12px/1 var(--mono);color:var(--c);letter-spacing:.06em}
.st{display:inline-flex;align-items:center;gap:6px;font:500 10px/1 var(--mono);letter-spacing:.12em;text-transform:uppercase;padding:5px 8px;border-radius:999px;background:rgba(255,255,255,.06);color:var(--t2)}
.st.live{color:#4ade80;background:rgba(74,222,128,.1)}
.st.live::before{content:"";width:6px;height:6px;border-radius:50%;background:#4ade80;box-shadow:0 0 8px #4ade80;animation:pulse 1.8s ease-in-out infinite}
@keyframes pulse{50%{opacity:.35}}
.gl{display:block;width:100%;height:62px;margin:14px 0 12px;overflow:visible}
.gl path{fill:none;stroke:var(--c);stroke-width:1.3;opacity:.75}
.gl .g2{opacity:.3;stroke-dasharray:2 4}
.gl circle{fill:var(--c)}
.card h3{font:600 23px/1.15 var(--disp);letter-spacing:-.02em;margin:0 0 8px;color:var(--text)}
.card p{font-size:12.5px;line-height:1.5;color:var(--t2);margin:0}
.hero{margin-top:auto;padding-top:12px;border-top:1px solid var(--line);font-size:12px;color:var(--text);display:flex;gap:7px;align-items:baseline}
.hero::before{content:"//";color:var(--c)}
.hero:empty{border:0;padding:0}
.hero:empty::before{content:none}
.open{margin-top:10px;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--c);opacity:0;transition:opacity .3s}
.card.front .open{opacity:1}
.ringnav{display:flex;align-items:center;justify-content:center;gap:14px;padding:0 20px 6px}
.arrow{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:rgba(255,255,255,.03);cursor:pointer;color:var(--t2);font-size:15px}
.arrow:hover{color:var(--text);border-color:rgba(255,255,255,.22)}
#dots{display:flex;gap:6px;align-items:center}
#dots button{width:16px;height:4px;padding:0;border:0;border-radius:2px;background:rgba(255,255,255,.2);cursor:pointer;transition:width .3s,background .3s;position:relative}
#dots button::before{content:"";position:absolute;inset:-10px -3px}
#dots button.on{width:32px;background:var(--accent)}
.hint{text-align:center;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--t3);margin:0;padding:4px 20px 16px}

/* detail panel */
#scrim{position:fixed;inset:0;z-index:8;background:rgba(0,0,0,.45);opacity:0;pointer-events:none;transition:opacity .35s}
#scrim.on{opacity:1;pointer-events:auto}
#detail{position:fixed;z-index:9;top:0;right:0;bottom:0;width:min(470px,100%);display:flex;flex-direction:column;
 background:rgba(9,9,13,.86);-webkit-backdrop-filter:blur(22px) saturate(1.3);backdrop-filter:blur(22px) saturate(1.3);border-left:1px solid color-mix(in srgb,var(--c,#888) 35%,transparent);
 transform:translateX(104%);transition:transform .5s cubic-bezier(.2,.8,.2,1);box-shadow:-30px 0 80px rgba(0,0,0,.5)}
#detail.show{transform:none}
#detail::before{content:"";position:absolute;left:0;right:0;top:0;height:2px;background:linear-gradient(90deg,var(--c),transparent)}
.dhead{display:flex;justify-content:space-between;align-items:center;padding:18px 22px 0}
.dcat{display:inline-flex;align-items:center;gap:8px;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--c)}
.dcat i{width:7px;height:7px;border-radius:50%;background:var(--c);box-shadow:0 0 8px var(--c)}
.x{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:none;cursor:pointer;color:var(--t2)}
.x:hover{color:var(--text)}
.dbody{flex:1;overflow-y:auto;padding:10px 22px 10px;overscroll-behavior:contain}
.drank{font-size:11.5px;color:var(--t3);letter-spacing:.1em}
.dbody h2{font:600 30px/1.08 var(--disp);letter-spacing:-.03em;margin:6px 0 8px}
.dtag{font-size:13.5px;color:var(--t2);margin:0 0 14px}
.dmeta{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:8px}
.dhero{font-size:11.5px;color:var(--text);padding:5px 9px;border-radius:999px;border:1px solid color-mix(in srgb,var(--c) 40%,transparent)}
.dbody section{margin-top:20px}
.dbody h4{font:500 11px/1 var(--mono);letter-spacing:.16em;text-transform:uppercase;color:var(--c);margin:0 0 8px}
.dbody section p{font:400 14.5px/1.6 var(--disp);color:#D4D4DC;margin:0}
.dbody ul{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.dbody li{font:500 14px/1.5 var(--disp);color:var(--text);padding:10px 12px;border-radius:12px;background:color-mix(in srgb,var(--c) 8%,transparent);border:1px solid color-mix(in srgb,var(--c) 20%,transparent)}
.dlinks{display:flex;flex-wrap:wrap;gap:8px;margin-top:22px}
.dlinks a{font-size:12px;text-decoration:none;padding:9px 13px;border-radius:999px;background:var(--c);color:#050507;font-weight:500}
.dlinks a+a{background:rgba(255,255,255,.07);color:var(--text)}
.dlinks a:hover{filter:brightness(1.12)}
.dlinks span{font-size:12px;color:var(--t3);padding:9px 0}
.dnote{font-size:11px;color:var(--t3);margin:24px 0 6px}
.dnav{display:flex;justify-content:space-between;align-items:center;padding:12px 22px calc(14px + env(safe-area-inset-bottom));border-top:1px solid var(--line)}
.dnav button{background:none;border:1px solid var(--line);border-radius:999px;padding:8px 13px;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--t2);cursor:pointer}
.dnav button:hover{color:var(--text)}
.dnav span{font-size:11.5px;color:var(--t3)}

@media (max-width:700px){
 .bar{padding:12px 16px}
 .bar nav{display:none}
 .node{--d:72px}
 .orbit{inset:-10px}
 .orbit i{width:5px;height:5px;margin:-2.5px;transform:rotate(var(--a)) translateY(calc(var(--d)/-2 - 10px))}
 .orb small{font-size:7.5px;letter-spacing:.12em}
 .lbl{width:118px;top:calc(var(--d)/2 + 16px)}
 .lbl strong{font-size:12.5px}
 .lbl em{display:none}
 #core{--d:94px}
 .h1{left:calc(var(--d)/-2 - 14px);top:calc(var(--d)/-2 - 14px);width:calc(var(--d) + 28px);height:calc(var(--d) + 28px)}
 .h2{display:none}
 #core .lbl{top:calc(var(--d)/2 + 22px)}
 #core .lbl strong{font-size:11px}
 .ahead{padding:0 16px;gap:10px 16px}
 .tabs{padding:12px 16px 0}
 .card{padding:16px 15px 14px}
 .card h3{font-size:19px}
 .gl{height:48px;margin:10px 0}
 #detail{top:auto;width:100%;height:86dvh;border-left:0;border-top:1px solid color-mix(in srgb,var(--c,#888) 35%,transparent);border-radius:22px 22px 0 0;transform:translateY(104%)}
 #detail::before{border-radius:22px 22px 0 0}
 .dbody h2{font-size:26px}
}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition-duration:.01s!important}}
</style>
</head>
<body>
<canvas id="bg" aria-hidden="true"></canvas>
<div class="glow" aria-hidden="true"></div>
<div class="floor" aria-hidden="true"></div>
<header class="bar">
  <a class="brand" href="/"><img src="/assets/bytarc-mark-white.svg" alt="BytArc logo" width="28" height="18">BytArc</a>
  <div class="crumb" id="crumb"></div>
  <nav aria-label="Pages"><a href="/">Home</a><a href="/about/">About</a><a href="/products/">Products</a><a href="/tomas-batalha/">Founder</a><a href="/mysystems/" aria-current="page">Systems</a></nav>
</header>
<main>
  <section id="map" class="view" aria-label="Systems map">
    <div class="intro">
      <p class="kick"><i>//</i> systems map</p>
      <h1>Every system I've built</h1>
      <p class="sub" id="sub"></p>
    </div>
    <div id="stage"><div id="plane"><svg id="wires" aria-hidden="true"></svg></div></div>
    <p class="mapfoot"><i></i>each dot is a system · bright dots are live</p>
  </section>
  <section id="area" class="view" aria-label="Systems in this area" hidden>
    <div class="ahead">
      <button class="back" id="back">← Map</button>
      <div class="atitle"><p class="ameta" id="ameta"></p><h2 id="atitle"></h2><p class="asub" id="asub"></p></div>
    </div>
    <div class="tabs" id="tabs" role="group" aria-label="Areas"></div>
    <div class="scene" id="scene"><div class="shadow"></div><div id="ring"></div></div>
    <div class="ringnav"><button class="arrow" id="prev" aria-label="Previous system">←</button><div id="dots"></div><button class="arrow" id="next" aria-label="Next system">→</button></div>
    <p class="hint" id="hint"></p>
  </section>
</main>
<div id="scrim"></div>
<aside id="detail" aria-hidden="true" aria-label="System details">
  <div class="dhead"><span class="dcat" id="dcat"></span><button class="x" id="dclose" aria-label="Close">✕</button></div>
  <div class="dbody" id="dbody"></div>
  <div class="dnav"><button id="dprev">← Prev</button><span id="dpos"></span><button id="dnext">Next →</button></div>
</aside>
<noscript><p style="position:fixed;inset:auto 0 40% 0;text-align:center">This map needs JavaScript.</p></noscript>
<script>

 ["data","Data & analysis","Models that decide","#FACC15"],

 ["tools","Tools & internal","My own toolbelt","#94A3B8"]
];
const S=[
{c:"jobalfred",n:"JobAlfred · AI Apply Copilot",t:"Chrome extension that fills job applications on any ATS",h:"5.0 stars · 8 reviews",
 s:"live",
 g:"Fill job applications on any applicant-tracking system from your CV, write cover letters and answers with AI, and track everything. The user checks every answer and presses Submit.",

 if(!dragging)return;const dx=e.clientX-sx;moved=Math.max(moved,Math.abs(dx));
 if(moved>6)stopAuto();
 let p=sp-dx/(cw*1.05);if(!wrap)p=Math.max(-.4,Math.min(n-.6,p));pos=tpos=p;
});
const endDrag=()=>{if(!dragging)return;dragging=false;scene.classList.remove("drag");tpos=wrap?Math.round(tpos):clampI(Math.round(tpos))};
addEventListener("pointerup",endDrag);addEventListener("pointercancel",endDrag);
let wacc=0,wlast=0;
scene.addEventListener("wheel",e=>{e.preventDefault();const d=Math.abs(e.deltaX)>Math.abs(e.deltaY)?e.deltaX:e.deltaY;wacc+=d;
 if(Math.abs(wacc)>45&&Date.now()-wlast>240){nudge(Math.sign(wacc));wacc=0;wlast=Date.now()}},{passive:false});
$("#prev").onclick=()=>nudge(-1);$("#next").onclick=()=>nudge(1);

/* ---------- area chrome ---------- */
function renderHead(){
 const a=AREAS[curK],live=xs.filter(x=>x.s==="live").length;
 $("#ameta").textContent=`${pad(n)} systems · ${pad(live)} live`;
 $("#atitle").textContent=a.name;$("#asub").textContent=a.sub;
 $("#tabs").innerHTML=ORDER.map(k=>`<button data-k="${k}" style="--c:${AREAS[k].col}" aria-pressed="${k===curK}"><i></i>${esc(AREAS[k].name)}</button>`).join("");
 [...$("#tabs").children].forEach(b=>b.onclick=()=>{location.hash=b.dataset.k});
 const act=$("#tabs").querySelector('[aria-pressed="true"]');if(act)act.scrollIntoView({block:"nearest",inline:"center"});
 $("#hint").textContent=mobile()?"Swipe to spin · tap the front card":"Drag, scroll or use ← → · click the front card";
}
function renderCrumb(){
 $("#crumb").innerHTML=`<span>/</span><button id="cmap">systems</button>${curK?`<span>/</span><b>${esc(AREAS[curK].name)}</b>`:""}`;
 $("#cmap").onclick=toMap;
}

/* ---------- detail ---------- */
const panel=$("#detail"),scrim=$("#scrim");
function showDetail(i){
 const x=xs[i],a=AREAS[x.c];detailIdx=i;
 panel.style.setProperty("--c",a.col);
 $("#dcat").innerHTML=`<i></i>${esc(a.name)}`;
 const links=x.l.length?x.l.map(([t,u])=>`<a href="${esc(u)}"${u.startsWith("http")?' target="_blank" rel="noopener"':""}>${esc(t)} ↗</a>`).join(""):`<span>Private · walkthrough on request</span>`;
 $("#dbody").innerHTML=`<div class="drank">#${pad(x.rank)} of ${S.length} systems</div><h2>${esc(x.n)}</h2><p class="dtag">${esc(x.t)}</p>
<div class="dmeta"><span class="st${x.s==="live"?" live":""}">${STATUS[x.s]}</span>${x.h?`<span class="dhero">${esc(x.h)}</span>`:""}</div>
<section><h4>// goal</h4><p>${esc(x.g)}</p></section>
<section><h4>// how it's built</h4><p>${esc(x.a)}</p></section>
${x.r.length?`<section><h4>// results</h4><ul>${x.r.map(r=>`<li>${esc(r)}</li>`).join("")}</ul></section>`:""}
<div class="dlinks">${links}</div>
<p class="dnote">Results list only numbers I can show from the systems themselves. Client systems are described without the client's name.</p>`;
 $("#dbody").scrollTop=0;
 $("#dpos").textContent=`${pad(i+1)} / ${pad(n)}`;
 $("#dprev").style.visibility=wrap||i>0?"visible":"hidden";
 $("#dnext").style.visibility=wrap||i<n-1?"visible":"hidden";
 panel.classList.add("show");panel.setAttribute("aria-hidden","false");scrim.classList.add("on");stopAuto();
}
function hideDetail(){panel.classList.remove("show");panel.setAttribute("aria-hidden","true");scrim.classList.remove("on");detailIdx=-1}
function openItem(i){location.hash=`${curK}/${xs[i].id}`}
function closeDetail(){history.replaceState(null,"","#"+curK);hideDetail()}
function stepDetail(d){let i=detailIdx+d;if(wrap)i=(i+n)%n;else if(i<0||i>=n)return;goTo(i);history.replaceState(null,"",`#${curK}/${xs[i].id}`);showDetail(i)}
$("#dclose").onclick=closeDetail;scrim.onclick=closeDetail;
$("#dprev").onclick=()=>stepDetail(-1);$("#dnext").onclick=()=>stepDetail(1);

/* ---------- routing ---------- */
function go(k,origin){lastOrigin=origin||null;location.hash=k}
function toMap(){history.pushState(null,"",location.pathname+location.search);route()}
$("#back").onclick=toMap;
function route(){
 const [k,id]=decodeURIComponent(location.hash.slice(1)).split("/");
 if(!AREAS[k]){
  hideDetail();
  if(view!=="map"){swapTo("map");requestAnimationFrame(layout)}
  curK=null;setAccent(null);renderCrumb();clearInterval(autoT);return;
 }
 if(curK!==k){
  if(view==="map")swapTo("area",lastOrigin);
  curK=k;setAccent(AREAS[k].col);
  requestAnimationFrame(()=>{buildRing(k);renderHead();if(id)openFromId(id)});
  renderCrumb();lastOrigin=null;
  if(!id)hideDetail();
  return;
 }
 lastOrigin=null;
 if(id)openFromId(id);else hideDetail();
}
function openFromId(id){const i=xs.findIndex(x=>x.id===id);if(i<0){hideDetail();return}goTo(i);if(zoom<1){pos=tpos}showDetail(i)}
addEventListener("hashchange",route);

addEventListener("keydown",e=>{
 if(e.key==="Escape"){if(detailIdx>=0)closeDetail();else if(view==="area")toMap();return}
 if(view!=="area")return;
 if(e.key==="ArrowRight"||e.key==="ArrowLeft"){const d=e.key==="ArrowRight"?1:-1;detailIdx>=0?stepDetail(d):nudge(d);e.preventDefault()}
 if(e.key==="Enter"&&detailIdx<0&&!(document.activeElement&&document.activeElement.matches("button,a"))){openItem(frontIdx())}
});

let rz;addEventListener("resize",()=>{clearTimeout(rz);rz=setTimeout(()=>{if(view==="map")layout();else{geometry();renderHead()}sizeBg()},120)});

/* ---------- background network ---------- */
const cv=$("#bg"),g=cv.getContext("2d");let P=[],W=0,H=0,dpr=1;
function sizeBg(){dpr=Math.min(devicePixelRatio||1,1.5);W=innerWidth;H=innerHeight;cv.width=W*dpr;cv.height=H*dpr;cv.style.width=W+"px";cv.style.height=H+"px";
 const N=Math.round(Math.min(80,W*H/16000));P=Array.from({length:N},()=>({x:Math.random()*W,y:Math.random()*H,vx:(Math.random()-.5)*.22,vy:(Math.random()-.5)*.22}))}
function drawBg(){
 g.setTransform(dpr,0,0,dpr,0,0);g.clearRect(0,0,W,H);
 const [r,gg,b]=acc.map(Math.round);
 for(const p of P){if(!reduce){p.x+=p.vx;p.y+=p.vy}if(p.x<0)p.x+=W;if(p.x>W)p.x-=W;if(p.y<0)p.y+=H;if(p.y>H)p.y-=H}
 g.lineWidth=1;
 for(let i=0;i<P.length;i++){const a=P[i];
  g.fillStyle=`rgba(${r},${gg},${b},.45)`;g.fillRect(a.x-1,a.y-1,2,2);
  for(let j=i+1;j<P.length;j++){const c=P[j],dx=a.x-c.x,dy=a.y-c.y,d=dx*dx+dy*dy;
   if(d<15000){g.strokeStyle=`rgba(${r},${gg},${b},${(1-d/15000)*.14})`;g.beginPath();g.moveTo(a.x,a.y);g.lineTo(c.x,c.y);g.stroke()}}}
}
sizeBg();

/* ---------- main loop ---------- */
let tilt=[0,0],tiltT=[0,0];
function frame(){
 for(let i=0;i<3;i++)acc[i]+=(accT[i]-acc[i])*.06;
 tilt[0]+=(tiltT[0]-tilt[0])*.06;tilt[1]+=(tiltT[1]-tilt[1])*.06;
 if(view==="map"){plane.style.transform=reduce?"":`rotateX(${(-tilt[1]*7).toFixed(2)}deg) rotateY(${(tilt[0]*9).toFixed(2)}deg)`}
 else if(n){
  if(!dragging){pos+=(tpos-pos)*(reduce?1:.09);if(Math.abs(tpos-pos)<.0005)pos=tpos}
  zoom+=(1-zoom)*.06;if(zoom>.999)zoom=1;
  const ez=1-Math.pow(1-zoom,2);
  ring.style.transform=`translateZ(${(-R-(1-ez)*1600).toFixed(1)}px) rotateX(${(-6-tilt[1]*6).toFixed(2)}deg) rotateY(${(-pos*step+tilt[0]*8).toFixed(2)}deg)`;
  for(let i=0;i<n;i++){
   let d=i-pos;if(wrap){d=((d%n)+n)%n;if(d>n/2)d-=n}
   const ang=Math.abs(d*step),c=cards[i];
   c.style.opacity=(ang>100?0:Math.max(.14,1-ang/105)*Math.min(1,ez*1.4)).toFixed(3);
   c.style.pointerEvents=ang>90?"none":"auto";
   c.classList.toggle("front",Math.abs(d)<.5);
  }
  const f=frontIdx();
  if(f!==frontShown){frontShown=f;[...$("#dots").children].forEach((b,i)=>b.classList.toggle("on",i===f))}
 }
 drawBg();
 requestAnimationFrame(frame);
}
renderCrumb();
requestAnimationFrame(()=>{layout();route();frame()});
</script>
</body>
</html>
