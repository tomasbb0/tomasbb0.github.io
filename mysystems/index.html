<title>Systems map · Tomás Batalha · BytArc</title>
<meta name="description" content="An interactive map of every system Tomás Batalha has built at BytArc: agents, the JobAlfred platform, AI products, data models, client systems and tools.">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#28282d">
<link rel="apple-touch-icon" href="/assets/apple-touch-icon.png?v=5">
<link rel="icon" href="/favicon.ico?v=5" sizes="48x48">
<link rel="icon" href="/favicon.svg?v=6" type="image/svg+xml">

<style>
/* Pixel theme: the BytArc squares look. Ash background on a 12px grid, a black band of cells dripping from the top,
   everything drawn in white and grey cells. No colour: areas are told apart by their pixel icons. */
:root{--bg:#28282d;--line:#313137;--text:#F4F4F6;--t2:#B4B4BC;--t3:#80808A;--panel:#141417;--btn:#1c1c21;--edge:#000;
 --disp:"Space Grotesk",ui-sans-serif,system-ui,sans-serif;--mono:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,monospace;color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.55 var(--mono);-webkit-font-smoothing:antialiased;overflow:hidden;display:flex;flex-direction:column;height:100dvh}
button{font:inherit;color:inherit}
a{color:inherit}
#bg{position:fixed;inset:0;z-index:0;pointer-events:none}
svg.px{display:block;shape-rendering:crispEdges}

/* buttons: dark faces with a hard 3D edge, pressed into the edge on click */
.pbtn{background:var(--btn);border:0;border-radius:0;box-shadow:4px 4px 0 var(--edge);cursor:pointer;color:var(--t2);transition:translate .06s,box-shadow .06s,color .2s,background-color .2s}
.pbtn:hover{color:var(--text);background:#24242a}
.pbtn:active{translate:4px 4px;box-shadow:0 0 0 var(--edge)}

/* top bar */
.bar{position:relative;z-index:5;display:flex;align-items:center;gap:18px;padding:14px 28px}
.brand{display:inline-flex;align-items:center;gap:10px;font:600 17px/1 var(--disp);letter-spacing:-.02em;text-decoration:none}
.brand img{width:28px;height:18px;display:block}
.crumb{display:flex;align-items:center;gap:8px;font-size:12px;text-transform:uppercase;letter-spacing:.1em;color:var(--t3);min-width:0}
.crumb button{background:none;border:0;padding:0;cursor:pointer;color:var(--t2);text-transform:inherit;letter-spacing:inherit}
.crumb button:hover{color:var(--text)}
.crumb b{color:var(--text);font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar nav{margin-left:auto;display:flex;gap:4px;font-size:13px;color:var(--t2)}
.bar nav a{text-decoration:none;padding:8px 12px}.bar nav a:hover{color:var(--text)}
.bar nav a[aria-current]{color:var(--text);background:rgba(255,255,255,.08)}

main{position:relative;flex:1;min-height:0;z-index:2}
.view{position:absolute;inset:0;display:flex;flex-direction:column;transition:opacity .5s ease,transform .7s cubic-bezier(.2,.75,.1,1)}
.view[hidden]{display:none}
#map.leave,#map.enter{opacity:0;pointer-events:none}
#area.leave{opacity:0;transform:scale(.88);pointer-events:none}
#area.enter{opacity:0;transform:scale(.92)}

/* map: the pixels are drawn on the background canvas, these are the labels and the hit areas */
.intro{text-align:center;padding:4px 20px 0}
.kick{font-size:11px;letter-spacing:.24em;text-transform:uppercase;color:var(--t3);margin:0}
.kick i{font-style:normal;color:var(--text)}
h1{font:600 clamp(28px,4.4vw,50px)/1.05 var(--disp);letter-spacing:-.035em;margin:8px 0 8px}
.sub{font-size:12.5px;color:var(--t2);margin:0}
.sub b{color:var(--text);font-weight:500}
#stage{position:relative;flex:1;min-height:300px}
.node,#core{position:absolute;width:0;height:0;padding:0;border:0;background:none;cursor:pointer;-webkit-tap-highlight-color:transparent}
.hit{position:absolute;left:calc(var(--d)/-2);top:calc(var(--d)/-2);width:var(--d);height:var(--d)}
#core .hit{left:calc(var(--w)/-2);top:calc(var(--h)/-2);width:var(--w);height:var(--h)}
.node:focus-visible,#core:focus-visible{outline:none}
.node:focus-visible .hit,#core:focus-visible .hit{outline:2px solid #fff;outline-offset:6px}
.lbl{position:absolute;left:0;top:calc(var(--d)/2 + 12px);transform:translateX(-50%);width:210px;text-align:center;pointer-events:none}
.lbl strong{display:block;font:600 16px/1.2 var(--disp);letter-spacing:-.01em;color:var(--text);text-shadow:0 1px 0 #000}
.lbl em{display:block;font-style:normal;font-size:11px;color:var(--t2);margin-top:3px}
.node:hover .lbl strong{text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:4px}
#core .tag{position:absolute;left:0;top:calc(var(--cs)*2.4);transform:translateX(-50%);font-size:9.5px;letter-spacing:.22em;text-transform:uppercase;color:var(--t2);white-space:nowrap;pointer-events:none}
#core .lbl{top:calc(var(--h)/2 + 12px)}
#core .lbl strong{white-space:nowrap;font:500 12.5px/1.2 var(--mono);color:var(--t2)}
#core:hover .lbl strong{color:var(--text)}
.mapfoot{text-align:center;font-size:11px;color:var(--t2);padding:6px 20px 14px;margin:0}
.mapfoot i{display:inline-block;width:8px;height:8px;background:#fff;margin:0 6px 1px 0;vertical-align:middle}
.mapfoot i.g{background:#78787f;margin-left:10px}

/* area */
.ahead{display:flex;align-items:center;gap:16px 22px;padding:2px 28px 0;flex-wrap:wrap}
.back{flex:none;padding:9px 14px;font-size:11px;letter-spacing:.12em;text-transform:uppercase}
.atitle{display:flex;align-items:center;gap:16px;min-width:0}
.aicon{flex:none;padding:6px;background:#000;box-shadow:4px 4px 0 rgba(0,0,0,.4)}
.ameta{font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--t2);margin:0}
.atitle h2{font:600 clamp(26px,3.8vw,42px)/1.05 var(--disp);letter-spacing:-.035em;margin:4px 0 2px}
.asub{font-size:12.5px;color:var(--t2);margin:0}
.tabs{display:flex;gap:12px;overflow-x:auto;padding:14px 28px 8px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:none;display:inline-flex;align-items:center;gap:8px;padding:8px 12px;font-size:11px;letter-spacing:.06em;text-transform:uppercase}
.tabs button[aria-pressed=true]{background:#fff;color:#0a0a0d}
.tabs button[aria-pressed=true] svg rect{fill:#0a0a0d}
.scene{position:relative;flex:1;min-height:320px;perspective:1150px;touch-action:none;cursor:grab;overflow:hidden;user-select:none;-webkit-user-select:none}
.scene.drag{cursor:grabbing}
#ring{position:absolute;left:50%;top:48%;width:0;height:0;transform-style:preserve-3d}
.shadow{position:absolute;left:50%;top:calc(48% + var(--ch)/2 + 16px);width:min(760px,95%);height:60px;transform:translateX(-50%);background:radial-gradient(closest-side,rgba(0,0,0,.55),transparent);pointer-events:none}
.card{position:absolute;left:0;top:0;width:var(--cw);height:var(--ch);margin:calc(var(--ch)/-2) 0 0 calc(var(--cw)/-2);padding:18px 18px 16px;overflow:hidden;
 display:flex;flex-direction:column;cursor:pointer;backface-visibility:hidden;-webkit-backface-visibility:hidden;
 background-color:#0f0f12;background-image:linear-gradient(#17171b 1px,transparent 1px),linear-gradient(90deg,#17171b 1px,transparent 1px);background-size:12px 12px;
 border:1px solid #3a3a42;box-shadow:8px 8px 0 #000;transition:border-color .3s}
.card.front{border-color:#fff;box-shadow:8px 8px 0 #000,0 0 0 1px #fff}
.card::after{content:"";position:absolute;left:0;right:0;top:0;height:24px;pointer-events:none;background:rgba(255,255,255,.05);opacity:0}
.card.front::after{opacity:1;animation:scan 3s steps(26) infinite}
@keyframes scan{from{transform:translateY(-24px)}to{transform:translateY(var(--ch))}}
.ctop{display:flex;justify-content:space-between;align-items:center;gap:8px}
.rk{display:inline-flex;align-items:center;gap:8px;font:500 12px/1 var(--mono);color:var(--t2);letter-spacing:.06em}
.st{display:inline-flex;align-items:center;gap:6px;font:500 10px/1 var(--mono);letter-spacing:.12em;text-transform:uppercase;padding:5px 7px;background:#26262c;color:var(--t2)}
.st.live{background:#fff;color:#0a0a0d}
.st.live::before{content:"";width:6px;height:6px;background:#0a0a0d;animation:blink 1.2s steps(2) infinite}
.st.archived{background:transparent;box-shadow:inset 0 0 0 1px #3a3a42;color:var(--t3)}
@keyframes blink{50%{opacity:0}}
.gl{width:100%;height:58px;margin:14px 0 12px}
.card.front .gl .tw{animation:tw 2.4s steps(3) infinite}
@keyframes tw{50%{opacity:.2}}
.card h3{font:600 23px/1.15 var(--disp);letter-spacing:-.02em;margin:0 0 8px;color:var(--text)}
.card p{font-size:12.5px;line-height:1.5;color:var(--t2);margin:0}
.hero{margin-top:auto;padding-top:12px;border-top:1px dashed #3a3a42;font-size:12px;color:var(--text);display:flex;gap:8px;align-items:baseline}
.hero::before{content:"";flex:none;width:7px;height:7px;background:#fff;transform:translateY(-1px)}
.hero:empty{border:0;padding:0}
.hero:empty::before{content:none}
.open{margin-top:10px;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:#fff;opacity:0;transition:opacity .3s}
.card.front .open{opacity:1}
.ringnav{display:flex;align-items:center;justify-content:center;gap:16px;padding:0 20px 8px}
.arrow{width:40px;height:40px;font-size:15px}
#dots{display:flex;gap:5px;align-items:center;flex-wrap:wrap;justify-content:center;max-width:62vw}
#dots button{width:8px;height:8px;padding:0;border:0;background:#55555d;cursor:pointer;transition:width .25s,background .25s;position:relative}
#dots button::before{content:"";position:absolute;inset:-8px -2px}
#dots button.on{width:22px;background:#fff}
.hint{text-align:center;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--t2);margin:0;padding:4px 20px 16px}

/* detail panel */
#scrim{position:fixed;inset:0;z-index:8;background:rgba(0,0,0,.5);opacity:0;pointer-events:none;transition:opacity .3s}
#scrim.on{opacity:1;pointer-events:auto}
#detail{position:fixed;z-index:9;top:0;right:0;bottom:0;width:min(470px,100%);display:flex;flex-direction:column;
 background-color:var(--panel);background-image:linear-gradient(#1a1a1e 1px,transparent 1px),linear-gradient(90deg,#1a1a1e 1px,transparent 1px);background-size:12px 12px;
 border-left:2px solid #fff;transform:translateX(104%);transition:transform .45s cubic-bezier(.2,.8,.2,1);box-shadow:-16px 0 0 rgba(0,0,0,.35)}
#detail.show{transform:none}
.dhead{display:flex;justify-content:space-between;align-items:center;padding:18px 22px 0}
.dcat{display:inline-flex;align-items:center;gap:10px;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--t2)}
.x{width:36px;height:36px}
.dbody{flex:1;overflow-y:auto;padding:10px 22px 10px;overscroll-behavior:contain}
.drank{font-size:11.5px;color:var(--t3);letter-spacing:.1em}
.dbody h2{font:600 30px/1.08 var(--disp);letter-spacing:-.03em;margin:6px 0 8px}
.dtag{font-size:13.5px;color:var(--t2);margin:0 0 14px}
.dmeta{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:8px}
.dhero{font-size:11.5px;color:var(--text);padding:4px 8px;box-shadow:inset 0 0 0 1px #55555d}
.dbody section{margin-top:22px}
.dbody h4{display:flex;align-items:center;gap:8px;font:500 11px/1 var(--mono);letter-spacing:.16em;text-transform:uppercase;color:#fff;margin:0 0 9px}
.dbody h4::before{content:"";width:8px;height:8px;background:#fff}
.dbody section p{font:400 14.5px/1.6 var(--disp);color:#D6D6DC;margin:0}
.dbody ul{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.dbody li{font:500 14px/1.5 var(--disp);color:var(--text);padding:10px 12px;background:#1f1f24;border-left:4px solid #fff}
.dlinks{display:flex;flex-wrap:wrap;gap:14px;margin-top:24px}
.dlinks a{font-size:12px;text-decoration:none;padding:10px 14px;background:#fff;color:#0a0a0d;font-weight:500;box-shadow:4px 4px 0 #000;transition:translate .06s,box-shadow .06s}
.dlinks a+a{background:var(--btn);color:var(--text)}
.dlinks a:active{translate:4px 4px;box-shadow:0 0 0 #000}
.dlinks span{font-size:12px;color:var(--t3);padding:9px 0}
.dnote{font-size:11px;color:var(--t3);margin:26px 0 6px}
.dnav{display:flex;justify-content:space-between;align-items:center;padding:14px 22px calc(16px + env(safe-area-inset-bottom));border-top:1px solid #2a2a30;background:var(--panel)}
.dnav button{padding:9px 13px;font-size:11px;letter-spacing:.1em;text-transform:uppercase}
.dnav span{font-size:11.5px;color:var(--t3)}

@media (max-width:700px){
 .bar{padding:12px 16px}
 .bar nav{display:none}
 .lbl{width:118px;top:calc(var(--d)/2 + 8px)}
 .lbl strong{font-size:12.5px}
 .lbl em{display:none}
 #core .tag{font-size:7.5px;letter-spacing:.14em}
 #core .lbl strong{font-size:11px}
 .ahead{padding:0 16px;gap:10px 14px}
 .aicon{padding:4px}
 .tabs{padding:12px 16px 8px}
 .card{padding:16px 15px 14px}
 .card h3{font-size:19px}
 .gl{height:44px;margin:10px 0}
 #detail{top:auto;width:100%;height:86dvh;border-left:0;border-top:2px solid #fff;transform:translateY(104%)}
 .dbody h2{font-size:26px}
}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition-duration:.01s!important}}
</style>
</head>

  ring.style.transform=`translateZ(${(-R-(1-ez)*1600).toFixed(1)}px) rotateX(${(-6-tilt[1]*6).toFixed(2)}deg) rotateY(${(-pos*step+tilt[0]*8).toFixed(2)}deg)`;
  for(let i=0;i<n;i++){
   let d=i-pos;if(wrap){d=((d%n)+n)%n;if(d>n/2)d-=n}
   const ang=Math.abs(d*step),c=cards[i];
   c.style.opacity=(ang>100?0:Math.max(.16,1-ang/105)*Math.min(1,ez*1.4)).toFixed(3);
   c.style.pointerEvents=ang>90?"none":"auto";
   c.classList.toggle("front",Math.abs(d)<.5);
  }
  const f=frontIdx();
  if(f!==frontShown){frontShown=f;[...$("#dots").children].forEach((b,i)=>b.classList.toggle("on",i===f))}
 }
 g.setTransform(dpr,0,0,dpr,0,0);g.drawImage(gridImg,0,0,W,H);
 drawField(reduce?0:t);flush();drawMap(t);flush();
 requestAnimationFrame(frame);
}
renderCrumb();
requestAnimationFrame(()=>{layout();route();requestAnimationFrame(frame)});
</script>
